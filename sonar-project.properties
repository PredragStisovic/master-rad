sonar.projectKey=PredragStisovic_master-rad
sonar.organization=predragstisovic
sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.exclusions=**/node_modules/**,**/dist/**,prisma/migrations/**

# Kept in step with `collectCoverageFrom` in package.json: these files are out of
# scope for the Jest report, so they never reach lcov.info. Without the same list
# here SonarQube analyses them, finds no coverage data and scores them 0%, which
# drags New Code coverage down on any PR that adds a controller or a repository.
sonar.coverage.exclusions=**/main.ts,**/*.module.ts,**/*.controller.ts,**/*.repository.ts,**/dto/**,**/entities/**,**/interfaces/**,src/config/** 